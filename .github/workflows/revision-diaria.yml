name: Revisión diaria de fuentes
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fuentes y publicar estado
        run: python scripts/revisar_fuentes.py
      - name: Guardar cambio solo si hay información nueva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado_fuentes.json
          if ! git diff --cached --quiet; then
            git commit -m "Revisión diaria automática de fuentes"
            git push
          fi
