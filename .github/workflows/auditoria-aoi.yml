name: Auditoría automática AOI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * 1"
permissions:
  contents: read
jobs:
  integridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de enlaces, datos y matemáticas
        run: python scripts/test_aoi.py
