name: Actualizar padrón geográfico Capítulo IV
on:
  workflow_dispatch:
  schedule:
    - cron: "35 9 8 * *"
  push:
    paths:
      - "scripts/actualizar_pozos.py"
      - ".github/workflows/actualizar-pozos.yml"
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y verificar coordenadas oficiales
        run: python scripts/actualizar_pozos.py
      - name: Publicar padrón y metadatos si cambian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pozos-oficiales.csv data/pozos-origen.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar padrón oficial de pozos Capítulo IV"
            git push
          fi
