name: AOI — revisión mensual de fuentes oficiales
on:
  schedule:
    - cron: "25 9 7 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aoi-monthly-official-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar fuentes y guardar huellas de procedencia
        run: python scripts/revision_mensual_fuentes.py
      - name: Publicar manifiesto de revisión
        if: always()
        run: |
          if test -f data/estado-actualizacion-mensual.json; then
            git config user.name "aoi-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/estado-actualizacion-mensual.json
            if ! git diff --cached --quiet; then
              git commit -m "datos: revisión mensual de fuentes públicas"
              git push
            fi
          fi
